name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      publish_auth:
        description: 'npm authentication mode for this publish'
        required: true
        default: oidc
        type: choice
        options:
          - oidc
          - token
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify release tag points to main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit reachable from origin/main." >&2
            exit 1
          fi

      - name: Clear npm config before registry setup
        run: |
          unset NPM_CONFIG_USERCONFIG
          rm -f ~/.npmrc

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify npm token auth
        if: github.event_name == 'workflow_dispatch' && inputs.publish_auth == 'token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
          run_install: false

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify scoped package identities
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          const expected = {
            'packages/sem-foundation/package.json': '@context-action/sem-foundation-contracts',
            'packages/sem-foundation-repository/package.json': '@context-action/sem-foundation-repository',
            'packages/sem-doc/package.json': '@context-action/sem-doc',
          };

          for (const [file, name] of Object.entries(expected)) {
            const packageJson = JSON.parse(fs.readFileSync(file, 'utf8'));
            const actual = packageJson.name;
            if (actual !== name) {
              throw new Error(`${file} must publish as ${name}, received ${actual}`);
            }
            if (packageJson.private === true) {
              throw new Error(`${file} is private and cannot be published`);
            }
            if (packageJson.publishConfig?.access !== 'public') {
              throw new Error(`${file} must declare publishConfig.access=public`);
            }
            if (!/^\d+\.\d+\.\d+(?:[-+][A-Za-z0-9.-]+)?$/u.test(packageJson.version)) {
              throw new Error(`${file} has an invalid version: ${packageJson.version}`);
            }
            console.log(`${file}: ${actual}@${packageJson.version}`);
          }
          NODE
          node --check scripts/publish-packages.cjs

      - name: Build private live-code-editor dependency
        run: pnpm build:live-code-editor

      - name: Build packages
        run: pnpm build

      - name: Verify package exports
        run: pnpm verify:package-exports

      - name: Verify package tarballs
        run: pnpm verify:package-tarballs

      - name: Type check packages
        run: pnpm type-check

      - name: Verify sem-doc release contract
        run: pnpm sem-doc:verify

      - name: Test packages
        run: pnpm test

      - name: Build docs
        run: pnpm docs:build

      - name: Build example
        run: pnpm --dir example build:fast

      - name: Run canonical example test
        run: pnpm test:canonical-example

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_auth == 'token' && secrets.NPM_TOKEN || '' }}
        run: |
          mkdir -p reports
          pnpm publish:packages -- reports/npm-publish-summary.json

      - name: Verify published sem-doc consumer install
        if: success()
        env:
          NODE_AUTH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_auth == 'token' && secrets.NPM_TOKEN || '' }}
        run: pnpm verify:published-consumer

      - name: Upload npm publish summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: npm-publish-summary
          path: reports/npm-publish-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Add npm publish summary to job summary
        if: always()
        run: |
          if [ -f reports/npm-publish-summary.json ]; then
            node scripts/print-npm-publish-summary.cjs reports/npm-publish-summary.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## npm publish result' >> "$GITHUB_STEP_SUMMARY"
            echo 'No publish summary was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

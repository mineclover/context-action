name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      publish_auth:
        description: 'npm authentication mode for this publish'
        required: true
        default: oidc
        type: choice
        options:
          - oidc
          - token
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # A publish workflow must never advance the default install tag. Promotion to
  # latest is a separate, post-verification operation.
  PUBLISH_DIST_TAG: next

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release tag points to main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit reachable from origin/main." >&2
            exit 1
          fi

      - name: Clear npm config before registry setup
        run: |
          unset NPM_CONFIG_USERCONFIG
          rm -f ~/.npmrc

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify npm token auth
        if: github.event_name == 'workflow_dispatch' && inputs.publish_auth == 'token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.30.3
          run_install: false

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify scoped package identities
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          const expected = {
            'packages/tool-protocol/package.json': '@context-action/tool-protocol',
            'packages/tool-durable-operations/package.json': '@context-action/tool-durable-operations',
          };

          for (const [file, name] of Object.entries(expected)) {
            const packageJson = JSON.parse(fs.readFileSync(file, 'utf8'));
            const actual = packageJson.name;
            if (actual !== name) {
              throw new Error(`${file} must publish as ${name}, received ${actual}`);
            }
            if (packageJson.private === true) {
              throw new Error(`${file} is private and cannot be published`);
            }
            if (packageJson.publishConfig?.access !== 'public') {
              throw new Error(`${file} must declare publishConfig.access=public`);
            }
            if (!/^\d+\.\d+\.\d+(?:[-+][A-Za-z0-9.-]+)?$/u.test(packageJson.version)) {
              throw new Error(`${file} has an invalid version: ${packageJson.version}`);
            }
            console.log(`${file}: ${actual}@${packageJson.version}`);
          }
          NODE
          node --check scripts/publish-packages.cjs

      - name: Run release gate
        run: pnpm release:check

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_auth == 'token' && secrets.NPM_TOKEN || '' }}
        run: |
          mkdir -p reports
          pnpm publish:packages -- reports/npm-publish-summary.json --dist-tag "$PUBLISH_DIST_TAG"

      - name: Verify published tool package consumer install
        if: success()
        env:
          NODE_AUTH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_auth == 'token' && secrets.NPM_TOKEN || '' }}
        run: pnpm verify:published-tool-consumers -- --tag "$PUBLISH_DIST_TAG"

      - name: Capture registry evidence
        if: success()
        run: |
          pnpm capture:published-release -- --tag "$PUBLISH_DIST_TAG" \
            --packages '@context-action/core,@context-action/react,@context-action/tool-protocol,@context-action/webmcp' \
            --consumer-status passed --output reports/npm-publish-registry-evidence.json

      - name: Upload npm publish evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: npm-publish-summary
          path: reports/npm-publish-*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Add npm publish summary to job summary
        if: always()
        run: |
          if [ -f reports/npm-publish-summary.json ]; then
            node scripts/print-npm-publish-summary.cjs reports/npm-publish-summary.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## npm publish result' >> "$GITHUB_STEP_SUMMARY"
            echo 'No publish summary was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

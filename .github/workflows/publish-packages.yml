name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      publish_auth:
        description: 'npm authentication mode for this publish'
        required: true
        default: oidc
        type: choice
        options:
          - oidc
          - token
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: context_action
          POSTGRES_PASSWORD: context_action
          POSTGRES_DB: context_action
        options: >-
          --health-cmd "pg_isready -U context_action -d context_action"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379
      DATABASE_URL: postgres://context_action:context_action@127.0.0.1:5432/context_action
      DURABLE_OPERATION_ENVIRONMENT: release
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release tag points to main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify manual publish runs from current main
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch origin main --no-tags
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Clear npm config before registry setup
        run: |
          unset NPM_CONFIG_USERCONFIG
          rm -f ~/.npmrc

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify npm token auth
        if: github.event_name == 'workflow_dispatch' && inputs.publish_auth == 'token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.30.3
          run_install: false

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify scoped package identities
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          const expected = {
            'packages/tool-protocol/package.json': '@context-action/tool-protocol',
            'packages/tool-durable-operations/package.json': '@context-action/tool-durable-operations',
          };

          for (const [file, name] of Object.entries(expected)) {
            const packageJson = JSON.parse(fs.readFileSync(file, 'utf8'));
            const actual = packageJson.name;
            if (actual !== name) {
              throw new Error(`${file} must publish as ${name}, received ${actual}`);
            }
            if (packageJson.private === true) {
              throw new Error(`${file} is private and cannot be published`);
            }
            if (packageJson.publishConfig?.access !== 'public') {
              throw new Error(`${file} must declare publishConfig.access=public`);
            }
            if (!/^\d+\.\d+\.\d+(?:[-+][A-Za-z0-9.-]+)?$/u.test(packageJson.version)) {
              throw new Error(`${file} has an invalid version: ${packageJson.version}`);
            }
            console.log(`${file}: ${actual}@${packageJson.version}`);
          }
          NODE
          node --check scripts/publish-packages.cjs

      - name: Run release gate
        run: pnpm release:check

      - name: Verify durable-operation external backends and bridges
        run: |
          pnpm tool-durable:verify:env
          pnpm tool-durable:verify:redis
          pnpm tool-durable:verify:postgres
          pnpm tool-durable:verify:http
          pnpm tool-durable:verify:queue

      - name: Verify source and packed release changelogs
        run: |
          node scripts/verify-tool-protocol-changelog.mjs --package typedoc-vitepress-sync --forbid-unreleased --require-release-date
          node scripts/verify-tool-protocol-changelog.mjs --package ai-sdk --forbid-unreleased --require-release-date
          node scripts/verify-tool-protocol-changelog.mjs --package tool-durable-operations --forbid-unreleased --require-release-date
          node scripts/verify-tool-protocol-changelog.mjs --package llms-generator --forbid-unreleased --require-release-date

      - name: Re-verify approved source immediately before publication
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_auth == 'token' && secrets.NPM_TOKEN || '' }}
        run: |
          mkdir -p reports
          pnpm publish:packages -- reports/npm-publish-summary.json --dist-tag next \
            --require-all-unpublished \
            --resume-matching-existing \
            --scope @context-action/typedoc-vitepress-sync \
            --scope @context-action/ai-sdk \
            --scope @context-action/tool-durable-operations \
            --scope @context-action/llms-generator

      - name: Verify published tool package consumer install
        if: success()
        env:
          NODE_AUTH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_auth == 'token' && secrets.NPM_TOKEN || '' }}
        run: pnpm verify:published-tool-consumers -- --tag next --packages "@context-action/typedoc-vitepress-sync,@context-action/ai-sdk,@context-action/tool-durable-operations,@context-action/llms-generator"

      - name: Capture registry evidence
        if: success()
        run: |
          pnpm capture:published-release -- --tag next \
            --packages "@context-action/typedoc-vitepress-sync,@context-action/ai-sdk,@context-action/tool-durable-operations,@context-action/llms-generator" \
            --consumer-status passed --output reports/npm-publish-registry-evidence.json

      - name: Upload npm publish evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: npm-publish-summary
          path: reports/npm-publish-*.json
          if-no-files-found: error
          retention-days: 14

      - name: Add npm publish summary to job summary
        if: always()
        run: |
          if [ -f reports/npm-publish-summary.json ]; then
            node scripts/print-npm-publish-summary.cjs reports/npm-publish-summary.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## npm publish result' >> "$GITHUB_STEP_SUMMARY"
            echo 'No publish summary was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

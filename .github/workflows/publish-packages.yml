name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      publish_auth:
        description: 'npm authentication mode for this publish'
        required: true
        default: oidc
        type: choice
        options:
          - oidc
          - token
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clear npm config before registry setup
        run: |
          unset NPM_CONFIG_USERCONFIG
          rm -f ~/.npmrc

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify npm token auth
        if: github.event_name == 'workflow_dispatch' && inputs.publish_auth == 'token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify scoped package identities
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          const expected = {
            'packages/sem-foundation/package.json': '@context-action/sem-foundation-contracts',
            'packages/sem-foundation-repository/package.json': '@context-action/sem-foundation-repository',
            'packages/sem-doc/package.json': '@context-action/sem-doc',
          };

          for (const [file, name] of Object.entries(expected)) {
            const actual = JSON.parse(fs.readFileSync(file, 'utf8')).name;
            if (actual !== name) {
              throw new Error(`${file} must publish as ${name}, received ${actual}`);
            }
            console.log(`${file}: ${actual}`);
          }
          NODE

      - name: Build private live-code-editor dependency
        run: pnpm build:live-code-editor

      - name: Build packages
        run: pnpm build

      - name: Verify package exports
        run: pnpm verify:package-exports

      - name: Verify package tarballs
        run: pnpm verify:package-tarballs

      - name: Type check packages
        run: pnpm type-check

      - name: Verify sem-doc release contract
        run: pnpm sem-doc:verify

      - name: Test packages
        run: pnpm test

      - name: Build docs
        run: pnpm docs:build

      - name: Build example
        run: pnpm --dir example build:fast

      - name: Run canonical example test
        run: pnpm test:canonical-example

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_auth == 'token' && secrets.NPM_TOKEN || '' }}
        run: |
          mkdir -p reports
          pnpm exec lerna publish from-package --yes --summary-file reports/npm-publish-summary.json

      - name: Upload npm publish summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: npm-publish-summary
          path: reports/npm-publish-summary.json
          if-no-files-found: ignore
          retention-days: 14

name: Publish Mutative Packages

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: 'Approved immutable main commit to publish'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-mutative:
    runs-on: ubuntu-latest
    environment:
      name: npm-stable
    timeout-minutes: 20
    steps:
      - name: Checkout approved main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_commit }}

      - name: Verify approved main release commit
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RELEASE_COMMIT" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main

      - name: Clear npm config before registry setup
        run: |
          unset NPM_CONFIG_USERCONFIG
          rm -f ~/.npmrc

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.30.3
          run_install: false

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      - name: Build published packages
        run: pnpm build

      - name: Type check published packages
        run: pnpm type-check

      - name: Verify package exports
        run: pnpm verify:package-exports

      - name: Test mutative package
        run: pnpm --filter @context-action/mutative test

      - name: Test mutative-core package
        run: pnpm --filter @context-action/mutative-core test

      - name: Verify package tarballs
        run: pnpm verify:package-tarballs

      - name: Verify source and packed release changelogs
        run: |
          node scripts/verify-tool-protocol-changelog.mjs --package mutative-core --forbid-unreleased --require-release-date
          node scripts/verify-tool-protocol-changelog.mjs --package mutative --forbid-unreleased --require-release-date

      - name: Re-verify approved source immediately before publication
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Publish the approved mutative package set to next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm publish:packages -- --summary-file reports/npm-mutative-summary.json --dist-tag next \
            --require-all-unpublished \
            --resume-matching-existing \
            --scope @context-action/mutative-core \
            --scope @context-action/mutative

      - name: Verify published mutative consumer matrix
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm verify:published-tool-consumers -- --tag next --packages "@context-action/mutative-core,@context-action/mutative"

      - name: Capture immutable registry evidence
        run: |
          pnpm capture:published-release -- --tag next --packages "@context-action/mutative-core,@context-action/mutative" \
            --consumer-status passed --output reports/npm-mutative-registry-evidence.json

      - name: Upload mutative publish evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: npm-mutative-evidence
          path: reports/npm-mutative-*.json
          if-no-files-found: error
          retention-days: 30

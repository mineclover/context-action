name: Publish Mutative Package

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-mutative:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Clear npm config before pnpm setup
        run: |
          unset NPM_CONFIG_USERCONFIG
          rm -f ~/.npmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      - name: Resolve mutative version
        id: mutative
        run: |
          VERSION=$(jq -r '.version' packages/mutative/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Mutative version: $VERSION"

      - name: Ensure version is unpublished
        run: |
          if npm view "@context-action/mutative@${{ steps.mutative.outputs.version }}" version >/dev/null 2>&1; then
            echo "Version ${{ steps.mutative.outputs.version }} is already published."
            exit 1
          fi
          echo "Version ${{ steps.mutative.outputs.version }} is not published yet."

      - name: Build mutative package
        run: pnpm --filter @context-action/mutative build

      - name: Test mutative package
        run: pnpm --filter @context-action/mutative test

      - name: Publish mutative package
        working-directory: packages/mutative
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

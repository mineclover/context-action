name: Publish Mutative Packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-mutative:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Clear npm config before registry setup
        run: |
          unset NPM_CONFIG_USERCONFIG
          rm -f ~/.npmrc

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.30.3
          run_install: false

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      - name: Resolve mutative version
        id: mutative
        run: |
          VERSION=$(jq -r '.version' packages/mutative/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Mutative version: $VERSION"

      - name: Resolve mutative-core version
        id: mutative_core
        run: |
          VERSION=$(jq -r '.version' packages/mutative-core/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Mutative core version: $VERSION"

      - name: Check if version is already published
        id: publish_check
        run: |
          if npm view "@context-action/mutative@${{ steps.mutative.outputs.version }}" version >/dev/null 2>&1; then
            echo "Version ${{ steps.mutative.outputs.version }} is already published."
            echo "already_published=true" >> $GITHUB_OUTPUT
          else
            echo "Version ${{ steps.mutative.outputs.version }} is not published yet."
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if mutative-core version is already published
        id: publish_core_check
        run: |
          if npm view "@context-action/mutative-core@${{ steps.mutative_core.outputs.version }}" version >/dev/null 2>&1; then
            echo "Version ${{ steps.mutative_core.outputs.version }} is already published."
            echo "already_published=true" >> $GITHUB_OUTPUT
          else
            echo "Version ${{ steps.mutative_core.outputs.version }} is not published yet."
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi

      - name: Build published packages
        if: steps.publish_check.outputs.already_published != 'true' || steps.publish_core_check.outputs.already_published != 'true'
        run: pnpm build

      - name: Type check published packages
        if: steps.publish_check.outputs.already_published != 'true' || steps.publish_core_check.outputs.already_published != 'true'
        run: pnpm type-check

      - name: Verify package exports
        if: steps.publish_check.outputs.already_published != 'true' || steps.publish_core_check.outputs.already_published != 'true'
        run: pnpm verify:package-exports

      - name: Test mutative package
        if: steps.publish_check.outputs.already_published != 'true' || steps.publish_core_check.outputs.already_published != 'true'
        run: pnpm --filter @context-action/mutative test

      - name: Test mutative-core package
        if: steps.publish_core_check.outputs.already_published != 'true'
        run: pnpm --filter @context-action/mutative-core test

      - name: Verify package tarballs
        if: steps.publish_check.outputs.already_published != 'true' || steps.publish_core_check.outputs.already_published != 'true'
        run: pnpm verify:package-tarballs

      - name: Publish mutative-core package
        if: steps.publish_core_check.outputs.already_published != 'true'
        working-directory: packages/mutative-core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Publish mutative package
        if: steps.publish_check.outputs.already_published != 'true'
        working-directory: packages/mutative
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Skip notice
        if: steps.publish_check.outputs.already_published == 'true'
        run: echo "Mutative ${{ steps.mutative.outputs.version }} is already published. Skipping publish."

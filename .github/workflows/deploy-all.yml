name: Deploy Documentation and Example

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'example/**'
      - 'demos/**'
      - 'packages/*/src/**'
      - 'scripts/verify-web-coding-build.mjs'
      - 'scripts/verify-web-coding-*.mjs'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-all.yml'
      - 'package.json'
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-changes:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.check.outputs.has-changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for relevant changes
        id: check
        run: |
          # 마지막 배포 이후 변경된 파일들 확인
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          
          # 관련 파일들이 변경되었는지 확인
          RELEVANT_CHANGES=false
          
          if echo "$CHANGED_FILES" | grep -E "(docs/|example/|demos/|packages/.*/src/|scripts/verify-web-coding-.*\.mjs|package\.json|pnpm-workspace\.yaml)"; then
            RELEVANT_CHANGES=true
          fi
          
          # 문서나 예제 관련 파일이 변경되었는지 확인
          if echo "$CHANGED_FILES" | grep -E "(\.md$|\.tsx?$|\.jsx?$|\.css$|\.html$)"; then
            RELEVANT_CHANGES=true
          fi
          
          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo "has-changes=$RELEVANT_CHANGES" >> $GITHUB_OUTPUT
          
          if [ "$RELEVANT_CHANGES" = "true" ]; then
            echo "✅ Relevant changes detected, proceeding with deployment"
          else
            echo "⏭️ No relevant changes detected, skipping deployment"
          fi

  build:
    needs: check-changes
    if: needs.check-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Clear npm config before pnpm setup
        run: |
          unset NPM_CONFIG_USERCONFIG
          rm -f ~/.npmrc
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CI에서 빌드 아티팩트 재사용 시도, 실패 시 직접 빌드
      - name: Try to download CI build artifacts
        id: download-artifacts
        uses: actions/download-artifact@v5
        with:
          name: build-artifacts-24
          path: .
        continue-on-error: true
        
      - name: Build packages (if artifacts not available)
        if: steps.download-artifacts.outcome == 'failure'
        run: pnpm build

      # Build documentation
      - name: Generate API documentation
        run: |
          pnpm docs:api
          pnpm docs:sync

      - name: Build documentation
        run: pnpm docs:build

      # Build example application
      - name: Build example application
        run: |
          cd example
          NODE_ENV=production pnpm build

      # Build the standalone Bolt-style web coding studio
      - name: Build standalone web coding demo
        run: NODE_ENV=production pnpm --filter @context-action/web-coding-demo build

      - name: Verify standalone static artifact
        run: node scripts/verify-web-coding-build.mjs demos/bolt-style-editor/dist

      - name: Verify standalone local-agent planning contracts
        run: node scripts/verify-web-coding-plan.mjs

      - name: Verify standalone preview document contracts
        run: node scripts/verify-web-coding-preview.mjs

      - name: Verify standalone filesystem adapter contracts
        run: node scripts/verify-web-coding-filesystem.mjs

      - name: Verify standalone browser flow
        run: |
          pnpm --filter @context-action/style-testing exec playwright install --with-deps chromium
          node scripts/verify-web-coding-browser.mjs

      # Combine both builds
      - name: Combine builds for deployment
        run: |
          # Create deployment directory
          mkdir -p deploy-dist
          
          # Copy documentation directly
          # VitePress already builds with base: '/context-action/' 
          # so internal links and assets are already correctly pathed
          cp -r docs/.vitepress/dist/* deploy-dist/
          
          # Add example application to /example subdirectory
          # The example app is built with base: '/context-action/example/'
          # so we just need to put it in the example/ subdirectory
          mkdir -p deploy-dist/example
          cp -r example/dist/* deploy-dist/example/
          
          # Copy 404.html for GitHub Pages SPA routing support
          if [ -f example/dist/404.html ]; then
            cp example/dist/404.html deploy-dist/example/404.html
          fi

          # Add the standalone web coding studio at /web-coding/
          mkdir -p deploy-dist/web-coding
          cp -r demos/bolt-style-editor/dist/* deploy-dist/web-coding/

          # Verify the exact directory that will be uploaded to Pages.
          node scripts/verify-web-coding-build.mjs deploy-dist/web-coding
          
          # Verify structure
          echo "📁 Deployment structure:"
          ls -la deploy-dist/
          echo "📁 Example subdirectory:"
          ls -la deploy-dist/example/
          echo "📁 Standalone web coding subdirectory:"
          ls -la deploy-dist/web-coding/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: deploy-dist

  deploy:
    if: github.ref == 'refs/heads/main' && needs.check-changes.outputs.has-changes == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: [check-changes, build]
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

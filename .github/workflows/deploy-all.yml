name: Deploy Documentation and Example

on:
  # CI is the source trigger. Deploy only after the corresponding CI run
  # succeeds so a commit does not produce both push and workflow_run deploys.
  workflow_dispatch:
    inputs:
      force:
        description: 'Deploy even when the latest commit has no detected documentation changes'
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-changes:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.check.outputs.has-changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Check for relevant changes
        id: check
        run: |
          # workflow_run checks the exact commit that CI validated. Manual
          # dispatches retain the previous HEAD~1 behavior.
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            BASE_SHA="${{ github.event.workflow_run.head_sha }}^"
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            BASE_SHA="HEAD~1"
            HEAD_SHA="HEAD"
          fi
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          
          # 관련 파일들이 변경되었는지 확인
          RELEVANT_CHANGES=false
          
          if echo "$CHANGED_FILES" | grep -E "(docs/|example/|demos/|packages/.*/src/|scripts/verify-web-coding-.*\.mjs|package\.json|pnpm-workspace\.yaml)"; then
            RELEVANT_CHANGES=true
          fi
          
          # 문서나 예제 관련 파일이 변경되었는지 확인
          if echo "$CHANGED_FILES" | grep -E "(\.md$|\.tsx?$|\.jsx?$|\.css$|\.html$)"; then
            RELEVANT_CHANGES=true
          fi

          if [ "${{ inputs.force }}" = "true" ]; then
            RELEVANT_CHANGES=true
            echo "✅ Manual force deployment requested"
          fi
          
          echo "Changed files:"
          echo "$CHANGED_FILES"
          echo "has-changes=$RELEVANT_CHANGES" >> $GITHUB_OUTPUT
          
          if [ "$RELEVANT_CHANGES" = "true" ]; then
            echo "✅ Relevant changes detected, proceeding with deployment"
          else
            echo "⏭️ No relevant changes detected, skipping deployment"
          fi

  build:
    needs: check-changes
    if: needs.check-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Clear npm config before pnpm setup
        run: |
          unset NPM_CONFIG_USERCONFIG
          rm -f ~/.npmrc
          
      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.30.3
          run_install: false

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # workflow_run deploys can reuse artifacts from the exact CI run that
      # authorized this deployment. Manual dispatches have no upstream run,
      # so they build locally below.
      - name: Try to download CI build artifacts
        id: download-artifacts
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts-24
          # upload-artifact removes the common `packages/` prefix from the
          # uploaded paths. Restore it here so workspace package exports are
          # available to the example and documentation builds.
          path: packages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
        continue-on-error: true
        
      - name: Build packages (if artifacts not available)
        if: github.event_name != 'workflow_run' || steps.download-artifacts.outcome != 'success'
        run: |
          pnpm build:live-code-editor
          pnpm build

      # Build documentation
      - name: Generate API documentation
        run: |
          pnpm docs:api
          # CI build artifacts contain published package outputs but the
          # private TypeDoc sync CLI is not part of that artifact. Build its
          # local entrypoint before invoking docs:sync in this clean runner.
          pnpm --filter @context-action/typedoc-vitepress-sync build
          pnpm docs:sync

      - name: Build documentation
        run: pnpm docs:build

      # Build example application
      - name: Build example application
        run: |
          cd example
          NODE_ENV=production pnpm build

      # Build the standalone Bolt-style web coding studio
      - name: Build standalone web coding demo
        run: NODE_ENV=production pnpm --filter @context-action/web-coding-demo build

      - name: Verify standalone static artifact
        run: node scripts/verify-web-coding-build.mjs demos/bolt-style-editor/dist

      - name: Verify standalone Context-Action conventions
        run: node scripts/verify-web-coding-conventions.mjs

      - name: Verify standalone approval lifecycle
        run: node scripts/verify-web-coding-approval.mjs

      - name: Verify standalone tool trace lifecycle
        run: node scripts/verify-web-coding-trace.mjs

      - name: Verify standalone dev server contract
        run: node scripts/verify-web-coding-dev-server.mjs

      - name: Verify standalone local-agent planning contracts
        run: node scripts/verify-web-coding-plan.mjs

      - name: Verify standalone preview document contracts
        run: node scripts/verify-web-coding-preview.mjs

      - name: Verify standalone filesystem adapter contracts
        run: node scripts/verify-web-coding-filesystem.mjs

      - name: Verify standalone OpenRouter transport contracts
        run: node scripts/verify-web-coding-openrouter.mjs

      - name: Verify standalone browser flow
        run: |
          pnpm --filter @context-action/style-testing exec playwright install --with-deps chromium
          node scripts/verify-web-coding-production-browser.mjs
          node scripts/verify-web-coding-browser.mjs

      # Combine both builds
      - name: Combine builds for deployment
        run: |
          # Create deployment directory
          mkdir -p deploy-dist
          
          # Copy documentation directly
          # VitePress already builds with base: '/context-action/' 
          # so internal links and assets are already correctly pathed
          cp -r docs/.vitepress/dist/* deploy-dist/
          
          # Add example application to /example subdirectory
          # The example app is built with base: '/context-action/example/'
          # so we just need to put it in the example/ subdirectory
          mkdir -p deploy-dist/example
          cp -r example/dist/* deploy-dist/example/
          
          # Copy 404.html for GitHub Pages SPA routing support
          if [ -f example/dist/404.html ]; then
            cp example/dist/404.html deploy-dist/example/404.html
          fi

          # Add the standalone web coding studio at /web-coding/
          mkdir -p deploy-dist/web-coding
          cp -r demos/bolt-style-editor/dist/* deploy-dist/web-coding/

          # Verify the exact directory that will be uploaded to Pages.
          node scripts/verify-web-coding-build.mjs deploy-dist/web-coding
          
          # Verify structure
          echo "📁 Deployment structure:"
          ls -la deploy-dist/
          echo "📁 Example subdirectory:"
          ls -la deploy-dist/example/
          echo "📁 Standalone web coding subdirectory:"
          ls -la deploy-dist/web-coding/

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: deploy-dist

  deploy:
    if: >-
      needs.check-changes.outputs.has-changes == 'true' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') ||
      (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: [check-changes, build]
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

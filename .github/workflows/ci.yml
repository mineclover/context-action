name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      features:
        description: 'Additional features to run (comma-separated: llms, glossary)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: context_action
          POSTGRES_PASSWORD: context_action
          POSTGRES_DB: context_action
        options: >-
          --health-cmd "pg_isready -U context_action -d context_action"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379
      DATABASE_URL: postgres://context_action:context_action@127.0.0.1:5432/context_action
    
    strategy:
      fail-fast: false  # 하나 실패해도 다른 버전 테스트 계속 진행
      matrix:
        node-version: [24]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
        
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          
      - name: Clear npm config before pnpm setup
        run: |
          # NPM_CONFIG_USERCONFIG 환경변수 제거
          unset NPM_CONFIG_USERCONFIG
          # 기존 .npmrc 제거
          rm -f ~/.npmrc
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
        
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
            
      - name: Configure npm registry (if token exists)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
            echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
          fi
        
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify durable-operation CI endpoint configuration
        env:
          DURABLE_OPERATION_ENVIRONMENT: ci
        run: pnpm tool-durable:verify:env

      - name: Verify Redis durable-operation smoke path
        run: pnpm tool-durable:verify:redis

      - name: Verify PostgreSQL durable-operation smoke path
        run: pnpm tool-durable:verify:postgres

      - name: Verify HTTP durable-side-effect bridge smoke path
        run: pnpm tool-durable:verify:http

      - name: Verify queue durable-side-effect bridge smoke path
        run: pnpm tool-durable:verify:queue
          
      - name: Verify full repository
        run: pnpm verify:all

      - name: Report architecture change scope
        if: ${{ github.event_name == 'pull_request' && always() }}
        run: |
          status=0
          pnpm arch:build || status=$?
          if [[ "$status" -eq 0 ]]; then
            node packages/architecture-governance/dist/cli.js check \
              --root . \
              --registry architecture/registry.json \
              --sem \
              --from "${{ github.event.pull_request.base.sha }}" \
              --to "${{ github.event.pull_request.head.sha }}" \
              --format markdown \
              --output reports/architecture/pr-report.md || status=$?
          fi
          if [[ -f reports/architecture/pr-report.md ]]; then
            cat reports/architecture/pr-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Architecture report was not generated (exit $status)." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload architecture report
        if: ${{ github.event_name == 'pull_request' && always() }}
        uses: actions/upload-artifact@v6
        with:
          name: architecture-report-${{ matrix.node-version }}
          path: reports/architecture/pr-report.md
          if-no-files-found: ignore
          retention-days: 7
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts-${{ matrix.node-version }}
          path: |
            packages/*/dist
            packages/*/lib
          retention-days: 1
        
      - name: Upload example build artifacts  
        uses: actions/upload-artifact@v6
        with:
          name: example-build-${{ matrix.node-version }}
          path: example/dist
          retention-days: 1

  # 공통 setup job 추가로 병렬 최적화
  setup:
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
        
      - name: Clear npm config before pnpm setup
        run: |
          unset NPM_CONFIG_USERCONFIG
          rm -f ~/.npmrc
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
        
      - name: Configure npm registry (if token exists)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
            echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
          fi
          
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
        
      - name: Setup pnpm cache
        id: cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
          
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

  security:
    name: Security Audit
    needs: [test, setup]
    # Security is independent from test success, but still requires setup.
    if: ${{ always() && needs.setup.result == 'success' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
    permissions:
      actions: read
      contents: read
      security-events: write

  size-check:
    runs-on: ubuntu-latest
    needs: [test, setup]
    # Build artifacts are produced only after the test matrix reaches its
    # upload steps. Do not turn an upstream test failure into a secondary
    # artifact-download failure when there is nothing to inspect.
    if: ${{ needs.setup.result == 'success' && needs.test.result == 'success' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts-24
          # upload-artifact removes the common `packages/` prefix from the
          # uploaded paths, so restore it before the bundle checks below.
          path: packages
        
      - name: Check bundle sizes
        run: |
          echo "📦 Bundle Size Report"
          echo "===================="
          echo ""
          
          # Check if any dist directories exist
          if ! ls packages/*/dist/ > /dev/null 2>&1; then
            echo "❌ No dist directories found. Build may have failed."
            exit 1
          fi
          
          # Count packages processed
          processed=0
          
          for package in packages/*/dist/index.js; do
            if [ -f "$package" ]; then
              size=$(ls -lah "$package" | awk '{print $5}')
              gzip_size=$(gzip -c "$package" | wc -c)
              package_name=$(echo "$package" | sed 's|packages/||' | sed 's|/dist/index.js||')
              
              echo "📋 $package_name:"
              echo "   - Raw: $size"
              echo "   - Gzipped: ${gzip_size} bytes"
              echo ""
              
              processed=$((processed + 1))
            fi
          done
          
          if [ $processed -eq 0 ]; then
            echo "❌ No package bundles found to analyze."
            exit 1
          fi
          
          echo "✅ Analyzed $processed package(s) successfully."

  # 종합 결과 리포트 및 알림 job
  report:
    runs-on: ubuntu-latest
    needs: [test, security, size-check]
    if: ${{ always() }}  # 모든 경우에 실행
    
    steps:
      - name: Generate CI Report
        run: |
          echo "## 📊 CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status | Node.js Versions |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|------------------|" >> $GITHUB_STEP_SUMMARY
          
          # Test 상태 확인
          if [[ "${{ needs.test.result }}" == "success" ]]; then
            echo "| Tests | ✅ Passed | 24 |" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.test.result }}" == "failure" ]]; then
            echo "| Tests | ❌ Failed | 24 |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Tests | ⏭️ Skipped | 24 |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Security 상태 확인
          if [[ "${{ needs.security.result }}" == "success" ]]; then
            echo "| Security Audit | ✅ Passed | 24 |" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.security.result }}" == "failure" ]]; then
            echo "| Security Audit | ❌ Failed | 24 |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Security Audit | ⏭️ Skipped | 24 |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Size Check 상태 확인
          if [[ "${{ needs.size-check.result }}" == "success" ]]; then
            echo "| Bundle Size Check | ✅ Passed | 24 |" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.size-check.result }}" == "failure" ]]; then
            echo "| Bundle Size Check | ❌ Failed | 24 |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Bundle Size Check | ⏭️ Skipped | 24 |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # 실패한 job이 있는지 확인
          if [[ "${{ needs.test.result }}" == "failure" || "${{ needs.security.result }}" == "failure" || "${{ needs.size-check.result }}" == "failure" ]]; then
            echo "### ⚠️ Action Required" >> $GITHUB_STEP_SUMMARY
            echo "One or more jobs have failed. Please check the individual job logs for details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🎉 All Checks Passed!" >> $GITHUB_STEP_SUMMARY
            echo "All CI jobs completed successfully." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # 최적화 정보 추가
          echo "### 🚀 Performance Optimizations" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build artifacts shared between jobs" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Parallel execution for security and size checks" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Smart cache utilization" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Fail-fast disabled for Node.js matrix testing" >> $GITHUB_STEP_SUMMARY

  # 옵션 기능: LLMS 문서 상태 업데이트 (수동 트리거)
  llms-update:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && contains(github.event.inputs.features, 'llms')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      
      - name: Clear npm config before pnpm setup
        run: |
          unset NPM_CONFIG_USERCONFIG
          rm -f ~/.npmrc
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build LLMS generator
        run: pnpm build:llms-generator
      
      - name: Get changed files
        id: changed-files
        run: |
          echo "files=$(git diff --name-only HEAD^ HEAD | grep -E '^docs/.*\.md$' | grep -v llms/ | tr '\n' ' ')" >> $GITHUB_OUTPUT
      
      - name: Update LLMS status
        run: |
          for file in ${{ steps.changed-files.outputs.files }}; do
            if [[ $file =~ docs/(en|ko)/(.+)\.md$ ]]; then
              lang="${BASH_REMATCH[1]}"
              doc_path="${BASH_REMATCH[2]}"
              doc_id=$(echo "$doc_path" | sed 's/\//-/g')
              echo "Updating status for $lang/$doc_id"
              node packages/llms-generator/dist/cli/index.js work-update $lang $doc_id --source-modified
            fi
          done

  # 옵션 기능: 용어집 동기화 (수동 트리거)  
  glossary-sync:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && contains(github.event.inputs.features, 'glossary')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      
      - name: Clear npm config before pnpm setup
        run: |
          unset NPM_CONFIG_USERCONFIG
          rm -f ~/.npmrc
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build glossary package
        run: pnpm --filter @context-action/glossary build
      
      - name: Update glossary system
        run: pnpm glossary:update

name: Publish WebMCP Hygiene Patch

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: 'Immutable main commit containing @context-action/webmcp@0.1.1'
        required: true
        type: string
      confirmation:
        description: 'Type publish-webmcp-0.1.1 to publish only the hygiene patch to latest'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  WEBMCP_PACKAGE: '@context-action/webmcp'
  WEBMCP_VERSION: '0.1.1'

jobs:
  publish-webmcp-hygiene-patch:
    runs-on: ubuntu-latest
    environment:
      name: npm-stable
    timeout-minutes: 30
    steps:
      - name: Checkout approved patch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_commit }}

      - name: Verify main, immutable commit, and explicit confirmation
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          test "$CONFIRMATION" = publish-webmcp-0.1.1

      - name: Clear npm config before registry setup
        run: |
          unset NPM_CONFIG_USERCONFIG
          rm -f ~/.npmrc

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.30.3
          run_install: false

      - name: Verify npm automation-token auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate the exact WebMCP patch
        run: |
          node - <<'NODE'
          const pkg = require('./packages/webmcp/package.json');
          if (pkg.name !== process.env.WEBMCP_PACKAGE || pkg.version !== process.env.WEBMCP_VERSION) {
            throw new Error(`Expected ${process.env.WEBMCP_PACKAGE}@${process.env.WEBMCP_VERSION}`);
          }
          NODE

      - name: Build and test WebMCP patch
        run: |
          pnpm --filter @context-action/tool-protocol build
          pnpm --filter @context-action/webmcp build
          pnpm --filter @context-action/webmcp type-check
          pnpm --filter @context-action/webmcp test

      - name: Refuse an ambiguous existing patch version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "$WEBMCP_PACKAGE@$WEBMCP_VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            latest="$(npm view "$WEBMCP_PACKAGE" dist-tags.latest --json --registry=https://registry.npmjs.org | tr -d '\"')"
            test "$latest" = "$WEBMCP_VERSION" || {
              echo "Refusing to retag an already-published patch version; publish a new patch instead." >&2
              exit 1
            }
            echo 'WebMCP hygiene patch is already published and owns latest.'
            echo 'PUBLISH_REQUIRED=false' >> "$GITHUB_ENV"
          fi

      - name: Publish the new WebMCP patch to latest
        if: env.PUBLISH_REQUIRED != 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm publish:packages -- --summary-file reports/webmcp-hygiene-patch-summary.json \
            --dist-tag latest --scope @context-action/webmcp

      - name: Verify latest replacement and capture evidence
        run: |
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const delay = new Int32Array(new SharedArrayBuffer(4));
          let tags;
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            tags = JSON.parse(execFileSync('npm', ['view', process.env.WEBMCP_PACKAGE, 'dist-tags', '--json', '--registry=https://registry.npmjs.org'], { encoding: 'utf8' }));
            if (tags.latest === process.env.WEBMCP_VERSION && tags.next === '0.1.0' && tags.rc === '0.1.0-rc.0') process.exit(0);
            if (attempt < 12) Atomics.wait(delay, 0, 0, 5_000);
          }
          throw new Error(`WebMCP tags did not converge after publication: ${JSON.stringify(tags)}`);
          NODE
          pnpm verify:published-tool-consumers -- --tag latest --packages "$WEBMCP_PACKAGE"
          pnpm capture:published-release -- --tag latest --packages "$WEBMCP_PACKAGE" \
            --consumer-status passed --output reports/webmcp-hygiene-patch-registry-evidence.json

      - name: Upload hygiene-patch evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: webmcp-hygiene-patch-evidence
          path: reports/webmcp-hygiene-patch-*.json
          if-no-files-found: ignore
          retention-days: 30

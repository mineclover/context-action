name: Publish Prerelease

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'Prerelease npm dist-tag'
        required: true
        default: rc
        type: choice
        options:
          - rc
          - next

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PRERELEASE_PACKAGES: '@context-action/core,@context-action/react,@context-action/tool-protocol,@context-action/webmcp'

jobs:
  publish-prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Clear npm config before registry setup
        run: |
          unset NPM_CONFIG_USERCONFIG
          rm -f ~/.npmrc

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.30.3
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate prerelease package versions
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const expected = {
            'packages/core/package.json': '@context-action/core',
            'packages/react/package.json': '@context-action/react',
            'packages/tool-protocol/package.json': '@context-action/tool-protocol',
            'packages/webmcp/package.json': '@context-action/webmcp',
          };
          for (const [file, name] of Object.entries(expected)) {
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (pkg.name !== name || !/^\d+\.\d+\.\d+-[0-9A-Za-z.-]+$/u.test(pkg.version)) {
              throw new Error(`${file} must contain ${name} at an exact prerelease version`);
            }
          }
          NODE

      - name: Run release gate
        run: pnpm release:check

      - name: Publish the approved prerelease package set
        run: |
          pnpm publish:packages -- --summary-file reports/npm-prerelease-summary.json --dist-tag "${{ inputs.dist_tag }}" \
            --scope @context-action/core \
            --scope @context-action/tool-protocol \
            --scope @context-action/webmcp \
            --scope @context-action/react

      - name: Verify published prerelease consumer
        run: |
          pnpm verify:published-tool-consumers -- --tag "${{ inputs.dist_tag }}" --packages "$PRERELEASE_PACKAGES"

      - name: Upload prerelease publish summary
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: npm-prerelease-summary
          path: reports/npm-prerelease-summary.json
          if-no-files-found: ignore
          retention-days: 14

name: Promote Preact Public Preview

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: 'Exact main commit that published the reviewed Preact next candidate'
        required: true
        type: string
      confirmation:
        description: 'Type PROMOTE_PREACT_PUBLIC to promote the reviewed preview'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  promote-preact-public:
    runs-on: ubuntu-latest
    environment:
      name: npm-stable
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify approved candidate source and current main governance
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$CONFIRMATION" = "PROMOTE_PREACT_PUBLIC"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$RELEASE_COMMIT" HEAD
          git diff --exit-code
          git diff --cached --exit-code

      - name: Clear npm config before registry setup
        run: |
          unset NPM_CONFIG_USERCONFIG
          rm -f ~/.npmrc

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.30.3
          run_install: false

      - name: Verify npm token auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate public Preact release plan
        run: pnpm verify:preact-public-release -- --require-current-source

      - name: Verify reviewed Preact candidate consumer matrix
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          node scripts/verify-preact-public-provenance.mjs --tag next --commit "$RELEASE_COMMIT" \
            --output reports/npm-preact-public-promotion-preflight-provenance.json
          pnpm verify:published-tool-consumers -- --tag next \
            --packages "@context-action/preact,@context-action/preact-ui"

      - name: Promote reviewed Preact candidate to latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          node scripts/promote-preact-public.mjs --commit "$RELEASE_COMMIT" \
            --output reports/npm-preact-public-promotion-summary.json

      - name: Verify promoted Preact consumer matrix
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          pnpm verify:published-tool-consumers -- --tag latest \
            --packages "@context-action/preact,@context-action/preact-ui"
          node scripts/verify-preact-public-provenance.mjs --tag latest --commit "$RELEASE_COMMIT" \
            --output reports/npm-preact-public-promotion-provenance.json

      - name: Capture promoted Preact registry evidence
        run: |
          pnpm capture:published-release -- --tag latest \
            --packages "@context-action/preact,@context-action/preact-ui" \
            --consumer-status passed --output reports/npm-preact-public-promotion-registry-evidence.json

      - name: Upload promoted Preact evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: npm-preact-public-promotion-evidence
          path: reports/npm-preact-public-promotion-*.json
          if-no-files-found: error
          retention-days: 30

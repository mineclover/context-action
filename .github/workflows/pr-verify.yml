name: PR Verification Gate (#53)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'example/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/pr-verify.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: pr-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fast-gate:
    name: Local receipt audit and minimal fast smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Clear npm config before pnpm setup
        run: |
          unset NPM_CONFIG_USERCONFIG
          rm -f ~/.npmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 11.28.6
          run_install: false

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core and react for smoke checks
        run: pnpm build:core && pnpm build:react

      - name: Audit local verification receipt (Fail-Closed Gate)
        run: pnpm run verify:receipt

      - name: Verify change traceability
        if: github.event_name == 'pull_request'
        run: pnpm change:traceability

      - name: Fast contract and boundary smoke
        run: |
          pnpm package-boundary:check
          pnpm convention:check
          node scripts/verify-core-artifact-parity.mjs
          node scripts/verify-react-artifact-boundary.mjs
          node scripts/verify-react-webmcp-isolation.mjs
          node --test scripts/verify-durable-operation-evidence-schema.test.mjs

      - name: Verify Lit packages (build, type-check, unit, edge runtime)
        run: pnpm check:lit

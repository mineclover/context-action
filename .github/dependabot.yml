# GitHub Dependabot Configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Root package dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"  # 주간 → 월간으로 변경
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5  # 10 → 5로 줄임
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "security"
    ignore:
      # Major version updates require manual review
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Dependency grouping for batch updates
    groups:
      # Development tools (bundlers, linters, formatters)
      dev-tools:
        patterns:
          - "@biomejs/*"
          - "biome"
          - "eslint*"
          - "prettier*"
          - "typescript"
          - "ts-node"
          - "@types/*"
          - "tsdown"
          - "rolldown"
          - "vite*"
          - "@vitejs/*"
          - "vitest*"
        update-types:
          - "minor"
          - "patch"
      
      # Testing frameworks
      testing:
        patterns:
          - "jest*"
          - "@jest/*"
          - "@testing-library/*"
          - "vitest*"
          - "@vitest/*"
        update-types:
          - "minor" 
          - "patch"
      
      # Documentation tools
      docs:
        patterns:
          - "vitepress*"
          - "typedoc*"
          - "@vitepress/*"
        update-types:
          - "minor"
          - "patch"
      
      # Build and bundling tools
      build-tools:
        patterns:
          - "lerna"
          - "tsdown"
          - "rolldown" 
          - "@rolldown/*"
        update-types:
          - "minor"
          - "patch"
    # Security updates are always enabled
    allow:
      - dependency-type: "all"

  # Core package dependencies
  - package-ecosystem: "npm"
    directory: "/packages/core"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 2  # 5 → 2로 줄임
    commit-message:
      prefix: "deps(core)"
      prefix-development: "deps-dev(core)"
      include: "scope"
    labels:
      - "dependencies"
      - "core"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      all-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    allow:
      - dependency-type: "all"

  # React package dependencies
  - package-ecosystem: "npm"
    directory: "/packages/react"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(react)"
      prefix-development: "deps-dev(react)"
      include: "scope"
    labels:
      - "dependencies"
      - "react"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      react-deps:
        patterns:
          - "react*"
          - "@types/react*"
        update-types:
          - "patch"
      dev-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    allow:
      - dependency-type: "all"

  # LLMs Generator package dependencies
  - package-ecosystem: "npm"
    directory: "/packages/llms-generator"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(llms-generator)"
      prefix-development: "deps-dev(llms-generator)"
      include: "scope"
    labels:
      - "dependencies"
      - "llms-generator"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    allow:
      - dependency-type: "all"

  # Example app dependencies
  - package-ecosystem: "npm"
    directory: "/example"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(example)"
      prefix-development: "deps-dev(example)"
      include: "scope"
    labels:
      - "dependencies"
      - "example"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # UI and styling
      ui-styling:
        patterns:
          - "tailwindcss*"
          - "@tailwindcss/*"
          - "class-variance-authority"
          - "clsx"
          - "tailwind-merge"
        update-types:
          - "minor"
          - "patch"
      
      # React and routing
      react-ecosystem:
        patterns:
          - "react*"
          - "@types/react*"
          - "react-dom"
          - "react-router*"
        update-types:
          - "patch"
      
      # Development tools
      dev-tools:
        patterns:
          - "@biomejs/*" 
          - "biome"
          - "vite*"
          - "@vitejs/*"
          - "typescript"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
    allow:
      - dependency-type: "all"

  # Documentation dependencies
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(docs)"
      prefix-development: "deps-dev(docs)"
      include: "scope"
    labels:
      - "dependencies"
      - "documentation"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    allow:
      - dependency-type: "all"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    allow:
      - dependency-type: "all"
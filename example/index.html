<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Context Action Test App</title>
    <!-- GitHub Pages용 base URL 설정 (프로덕션만) -->
    <script>
      // 프로덕션 환경에서만 base URL 설정
      if (window.location.hostname === 'mineclover.github.io') {
        const base = document.createElement('base');
        base.href = '/context-action/example/';
        document.head.appendChild(base);
      }
    </script>
    
    <!-- GitHub Pages SPA 라우팅 지원 스크립트 -->
    <script>
      (function(l) {
        // VitePress 404 redirect 처리: ?redirect=<path>
        var params = new URLSearchParams(l.search);
        if (params.has('redirect')) {
          var redirectPath = decodeURIComponent(params.get('redirect'));
          console.log('VitePress redirect detected:', redirectPath);
          window.history.replaceState(null, null, redirectPath + l.hash);
          return;
        }

        // 기존 SPA 404 redirect 처리: ?/<path>
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

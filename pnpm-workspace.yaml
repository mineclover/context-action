# package.json#pnpm.peerDependencyRules에서 이동 (pnpm 11은 package.json의 pnpm 필드를 읽지 않음)
peerDependencyRules:
  ignoreMissing:
    - "@emnapi/*"
  allowAny:
    - browserslist
    - vite

# package.json#pnpm.ignoredBuiltDependencies(esbuild, nx) / onlyBuiltDependencies([])에서 이동.
# pnpm 10에서는 허용되지 않은 의존성 스크립트를 건너뛰었으므로 같은 동작을 유지한다.
allowBuilds:
  esbuild: false
  nx: false
  # pnpm 10에서는 설치/postinstall 스크립트가 실행되지 않던 의존성들.
  # pnpm 11은 strictDepBuilds가 기본 활성화라 명시하지 않으면 install이 실패하므로 같은 동작(false)으로 고정한다.
  "@parcel/watcher": false
  "@swc/core": false
  fsevents: false
  unrs-resolver: false

# .npmrc에서 이동한 설정 (pnpm 11은 .npmrc에서 인증/레지스트리 키만 읽음)
# Lerna integration: https://lerna.js.org/docs/recipes/using-pnpm-with-lerna

# Use pnpm's workspace protocol for local dependencies
linkWorkspacePackages: true

# Save exact versions of dependencies
saveExact: true

# Ensure pnpm doesn't hoist packages to avoid issues with Lerna
hoist: false

# Enable strict peer dependencies
strictPeerDependencies: true

# Auto-install peers
autoInstallPeers: true

# Ignore workspace root check warning
ignoreWorkspaceRootCheck: true
